name: Subscription and Session Certification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  subscription-session-runtime:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Disposable MySQL with a fresh masked job credential
        run: bash .github/scripts/start-test-mysql.sh stonefellow_91b21a_test
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
      - name: Date policy and period parsing
        run: php tests/section91b21a-policy.php
      - name: SQLite concurrency, rollback and independent PHP sessions
        env:
          SF_TEST_DRIVER: sqlite
        run: php tests/section91b21a-runtime.php
      - name: MySQL concurrency, rollback and independent PHP sessions
        env:
          SF_TEST_DRIVER: mysql
        run: php tests/section91b21a-runtime.php
