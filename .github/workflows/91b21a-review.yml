name: Apply 91B21A final review
on:
  push:
    branches: [codex/91b21a-subscription-session-correctness]
    paths: ['.github/91b21a-review.py', '.github/workflows/91b21a-review.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'davemt74-lang/stoneward' && github.ref == 'refs/heads/codex/91b21a-subscription-session-correctness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: Apply reviewed fixes and run acceptance
        run: |
          set -euo pipefail
          git merge-base --is-ancestor db15738de698f847c55e005df14273726a3384a9 HEAD
          python .github/91b21a-review.py
          git diff --check
          git diff --name-only -- '*.php' | xargs -r -n1 php -l
          php tests/section91b21a-policy.php
          SF_TEST_DRIVER=sqlite php tests/section91b21a-runtime.php
      - name: Commit only to the working branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=codex/91b21a-subscription-session-correctness
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/91b21a-review.py
          git add api admin tests docs
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(91B21A): align Admin access summaries and ordered initial billing events'
          git push origin "HEAD:refs/heads/$branch"
