name: Unified Login Protection Certification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  login-security-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Disposable MySQL with a fresh masked job credential
        run: bash .github/scripts/start-test-mysql.sh stonefellow_login_test
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
      - name: Endpoint contracts and input normalization
        run: php tests/section91b21b1-login-contract.php
      - name: SQLite concurrent admission and upgrade sessions
        env:
          SF_TEST_DRIVER: sqlite
        run: php tests/section91b21b1-login-runtime.php
      - name: MySQL concurrent admission and upgrade sessions
        env:
          SF_TEST_DRIVER: mysql
        run: php tests/section91b21b1-login-runtime.php
      - name: HTTP controllers, cookie sessions, CSRF and cooldown recovery
        run: python3 tests/section91b21b1-login-http.py
