name: Stonefellow v1.3.27 Admin Sidebar Fix Deploy

on:
  push:
    branches:
      - 'package/v1327-sidebarfix-deploy-verified'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v4
        with:
          ref: 142e8433b3cb06418d9ce83b68eaecb4512d66b2

      - name: Build deploy overlay
        run: |
          set -euo pipefail
          ZIP="Stonefellow-v1.3.27-Admin-Sidebar-Fix-Deploy.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          zip -r "$ZIP" . \
            -x '.git/*' \
               '.github/*' \
               'data/*' \
               'storage/*' \
               'config/database.php' \
               'config/app-secret.php' \
               'config/store.php' \
               'assets/js/config.js' \
               'assets/js/catalog.js' \
               'assets/js/releases.js' \
               "$ZIP" "$ZIP.sha256"
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^(data/|storage/|config/database.php$|config/app-secret.php$|config/store.php$|assets/js/(config|catalog|releases)\.js$)')" -eq 0
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^tests/v1327-admin-sidebar-density.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/assets/admin.css$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^upgrade.php$')" -eq 1

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stonefellow-v1.3.27-Admin-Sidebar-Fix-Deploy
          path: |
            Stonefellow-v1.3.27-Admin-Sidebar-Fix-Deploy.zip
            Stonefellow-v1.3.27-Admin-Sidebar-Fix-Deploy.zip.sha256
          if-no-files-found: error
          retention-days: 7
