name: Build Stonefellow v1.3.11 Deploy

on:
  push:
    branches:
      - package/v1311-deploy

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact package branch
        uses: actions/checkout@v4

      - name: Build deploy package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Stonefellow-v1.3.11-Deploy"
          rm -rf "$ROOT" Stonefellow-v1.3.11-Deploy.zip Stonefellow-v1.3.11-Deploy.zip.sha256
          mkdir -p "$ROOT"

          rsync -a ./ "$ROOT"/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='AUDIT-REPORT.md' \
            --exclude='TEST-RESULTS.txt' \
            --exclude='DEPLOY-MANIFEST.txt' \
            --exclude='config/store.php' \
            --exclude='data/' \
            --exclude='storage/' \
            --exclude='assets/js/config.js' \
            --exclude='assets/js/catalog.js' \
            --exclude='assets/js/releases.js' \
            --exclude='Stonefellow-v1.3.11-Deploy/' \
            --exclude='Stonefellow-v1.3.11-Deploy.zip' \
            --exclude='Stonefellow-v1.3.11-Deploy.zip.sha256'

          cat > "$ROOT/DEPLOY-MANIFEST.txt" <<'EOF'
          Stonefellow v1.3.11 Section 12 deploy package
          Source main commit: 9653aa0a98e3a9c9c85fcf8f99ebedb57880284f
          Database schema target: 1.3.11

          Deployment:
          1. Upload the ZIP to the Stonefellow web root.
          2. Extract over the existing installation.
          3. Run /upgrade.php to apply migration 2026-10-08-012.
          4. Confirm /version.php reports Stonefellow 1.3.11 and database schema target 1.3.11.
          5. Open Music and confirm Search & Discover loads tracks/releases, filters, and result actions.

          Section 12:
          - Unified server-backed track + release search.
          - Facets: type, mood, theme, release, year, energy.
          - Relevance, popularity, newest, and title sorting.
          - Signed-in personalized ranking and recent searches.
          - Search/click telemetry and Admin catalog intelligence.
          - Agent natural-language catalog search.

          Intentionally preserved / not overwritten:
          - config/store.php
          - config/database.php (not tracked in repository)
          - config/app-secret.php (not tracked in repository)
          - data/
          - storage/
          - assets/js/config.js
          - assets/js/catalog.js
          - assets/js/releases.js

          Development-only files excluded:
          - .github/
          - tests/
          - AUDIT-REPORT.md
          - TEST-RESULTS.txt
          EOF

          (
            cd "$ROOT"
            find . -type f ! -name 'FILE-SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > FILE-SHA256SUMS.txt
          )

          zip -qr Stonefellow-v1.3.11-Deploy.zip "$ROOT"
          sha256sum Stonefellow-v1.3.11-Deploy.zip > Stonefellow-v1.3.11-Deploy.zip.sha256

          unzip -t Stonefellow-v1.3.11-Deploy.zip
          test -f "$ROOT/upgrade.php"
          test -f "$ROOT/api/search-core.php"
          test -f "$ROOT/api/search.php"
          test -f "$ROOT/api/agent-runtime.php"
          test -f "$ROOT/admin/assets/analytics.js"
          test -f "$ROOT/version.php"
          grep -q "2026-10-08-012" "$ROOT/api/migrations.php"
          grep -q "1.3.11" "$ROOT/version.php"
          grep -q "Search & Discover" "$ROOT/assets/js/app.js"
          test ! -e "$ROOT/config/store.php"
          test ! -e "$ROOT/data"
          test ! -e "$ROOT/storage"
          test ! -e "$ROOT/assets/js/config.js"
          test ! -e "$ROOT/tests"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stonefellow-v1.3.11-Deploy
          path: |
            Stonefellow-v1.3.11-Deploy.zip
            Stonefellow-v1.3.11-Deploy.zip.sha256
          if-no-files-found: error
          compression-level: 0
