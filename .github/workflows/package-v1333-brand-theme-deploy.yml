name: Stonefellow v1.3.33 Brand Theme Deploy Package

on:
  push:
    branches:
      - 'package/v1333-brand-theme-deploy-verified'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v4
        with:
          ref: 357189ae640247849201e740cc4b955a1fd69897

      - name: Build deploy overlay
        run: |
          set -euo pipefail
          ZIP="Stonefellow-v1.3.33-Deploy.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          zip -r "$ZIP" . \
            -x '.git/*' \
               '.github/*' \
               'data/*' \
               'storage/*' \
               'config/database.php' \
               'config/app-secret.php' \
               'config/store.php' \
               'assets/js/config.js' \
               'assets/js/catalog.js' \
               'assets/js/releases.js' \
               "$ZIP" "$ZIP.sha256"
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^(data/|storage/|config/database.php$|config/app-secret.php$|config/store.php$|assets/js/(config|catalog|releases)\.js$)')" -eq 0
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^api/theme-core.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/api/theme.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/assets/theme.js$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/assets/theme.css$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^tests/v1333-section34-brand-theme.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^upgrade.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^version.php$')" -eq 1

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stonefellow-v1.3.33-Deploy
          path: |
            Stonefellow-v1.3.33-Deploy.zip
            Stonefellow-v1.3.33-Deploy.zip.sha256
          if-no-files-found: error
          retention-days: 7
