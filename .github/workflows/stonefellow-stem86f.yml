name: Stonefellow REAPER Automation + Agent Brain 86F
on:
  pull_request:
    paths:
      - 'api/stem-*.php'
      - 'api/agent-admin-brain.php'
      - 'api/agent-actions-core.php'
      - 'api/agent-tool-registry.php'
      - 'api/agent-skill-registry.php'
      - 'admin/api/stem-studio.php'
      - 'admin/api/agent-actions.php'
      - 'admin/assets/stem-*'
      - 'tests/section86f-*'
      - '.github/workflows/stonefellow-stem86f.yml'
  push:
    branches: [main]
    paths:
      - 'api/stem-*.php'
      - 'api/agent-admin-brain.php'
      - 'api/agent-actions-core.php'
      - 'api/agent-tool-registry.php'
      - 'api/agent-skill-registry.php'
      - 'admin/api/stem-studio.php'
      - 'admin/api/agent-actions.php'
      - 'admin/assets/stem-*'
      - 'tests/section86f-*'
permissions:
  contents: read
jobs:
  automation-brain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -eu
          php -l api/stem-automation-core.php
          php -l api/stem-agent-bridge.php
          php -l api/stem-studio-core.php
          php -l api/stem-rpp-core.php
          php -l api/agent-admin-brain.php
          php -l api/agent-actions-core.php
          php -l admin/api/stem-studio.php
          php -l admin/api/agent-actions.php
          node --check admin/assets/stem-automation.js
          node --check admin/assets/stem-studio.js
          node tests/section86f-automation.cjs
          php tests/section86f-automation-agent.php
          php tests/section86e-routing.php
          php tests/section86d-native-state.php
          php tests/section86c-reaper-plugin-rack.php
          node tests/section86c-plugin-rack.cjs
          php tests/section86b-timeline-fx.php
          php tests/section86a-stem-studio.php
