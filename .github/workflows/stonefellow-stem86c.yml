name: Stonefellow REAPER Plugin Rack 86C
on:
  pull_request:
    paths:
      - 'api/stem-rpp-plugins.php'
      - 'api/stem-rpp-core.php'
      - 'api/stem-plugin-operations.php'
      - 'api/stem-editor-core.php'
      - 'api/stem-studio-core.php'
      - 'admin/assets/stem-plugin-rack.js'
      - 'admin/assets/stem-fx-engine.js'
      - 'admin/assets/stem-studio.js'
      - 'admin/index.php'
      - 'tests/section86c-reaper-plugin-rack.php'
      - 'tests/section86c-plugin-rack.cjs'
      - '.github/workflows/stonefellow-stem86c.yml'
  push:
    branches: [main]
    paths:
      - 'api/stem-rpp-plugins.php'
      - 'api/stem-rpp-core.php'
      - 'api/stem-plugin-operations.php'
      - 'admin/assets/stem-plugin-rack.js'
      - 'admin/assets/stem-fx-engine.js'
      - 'tests/section86c-reaper-plugin-rack.php'
      - 'tests/section86c-plugin-rack.cjs'
permissions:
  contents: read
jobs:
  plugin-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -e
          php -l api/stem-rpp-plugins.php
          php -l api/stem-plugin-operations.php
          php -l api/stem-rpp-core.php
          php -l api/stem-editor-core.php
          php -l api/stem-studio-core.php
          node --check admin/assets/stem-plugin-rack.js
          node --check admin/assets/stem-fx-engine.js
          node --check admin/assets/stem-studio.js
          php tests/section86c-reaper-plugin-rack.php
          node tests/section86c-plugin-rack.cjs
          php tests/section86b-timeline-fx.php
          php tests/section86a-stem-studio.php
