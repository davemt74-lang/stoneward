name: Stonefellow Existing Media Publishing 85B
on:
  pull_request:
    paths:
      - 'api/track-media-publishing.php'
      - 'api/media-core.php'
      - 'api/media.php'
      - 'api/homeserver-music-core.php'
      - 'api/fan-owned-music-core.php'
      - 'api/vinyl-print-licenses.php'
      - 'api/kunaki-media-transfer.php'
      - 'api/bootstrap.php'
      - 'admin/api/media.php'
      - 'admin/assets/media.js'
      - 'admin/assets/media.css'
      - 'tests/section85b-media-publishing.php'
      - '.github/workflows/stonefellow-media-85b.yml'
  push:
    branches: [main]
    paths:
      - 'api/track-media-publishing.php'
      - 'api/media-core.php'
      - 'api/media.php'
      - 'admin/api/media.php'
      - 'admin/assets/media.js'
      - 'tests/section85b-media-publishing.php'
permissions:
  contents: read
jobs:
  media-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: Existing Media Library publishing tests
        run: |
          php -l api/track-media-publishing.php
          php -l api/media-core.php
          php -l admin/api/media.php
          php -l api/homeserver-music-core.php
          php -l api/fan-owned-music-core.php
          node --check admin/assets/media.js
          php tests/section85b-media-publishing.php
          php tests/section85a-site-ownership.php
          php tests/section84b7-homeserver-music.php
