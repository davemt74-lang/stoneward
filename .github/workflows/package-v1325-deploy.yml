name: Stonefellow v1.3.25 Deploy Package
on:
  push:
    branches: ['package/v1325-deploy-verified']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 73863f9664dc3f9d0f8c6603027a3414b3af524b
      - name: Build deploy overlay
        run: |
          set -euo pipefail
          ZIP="Stonefellow-v1.3.25-Deploy.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          zip -r "$ZIP" . -x '.git/*' '.github/*' 'data/*' 'storage/*' 'config/database.php' 'config/app-secret.php' 'config/store.php' 'assets/js/config.js' 'assets/js/catalog.js' 'assets/js/releases.js' "$ZIP" "$ZIP.sha256"
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^(data/|storage/|config/database.php$|config/app-secret.php$|config/store.php$|assets/js/(config|catalog|releases)\.js$)')" -eq 0
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^api/operating-calendar-core.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/assets/operating-calendar.js$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^upgrade.php$')" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: Stonefellow-v1.3.25-Deploy
          path: |
            Stonefellow-v1.3.25-Deploy.zip
            Stonefellow-v1.3.25-Deploy.zip.sha256
          if-no-files-found: error
          retention-days: 7
