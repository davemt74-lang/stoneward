name: Lyric Sidebar Certification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  lyric-sidebar:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production command and routing regression checks
        run: node --test tests/section91b21b3-lyrics.test.cjs
      - name: Real Chromium desktop and mobile-width UI
        env:
          SF_LYRICS_EVIDENCE: lyric-evidence
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python tests/section91b21b3-lyrics-browser.py
      - name: Retain screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyric-sidebar-evidence
          path: lyric-evidence
          if-no-files-found: ignore
