name: Stonefellow v1.3.35 Deploy Package

on:
  push:
    branches:
      - 'package/v1335-deploy-verified'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v4
        with:
          ref: 6a4adb02367c39b64049bc2e2ac0cbbf529e95ff

      - name: Build deploy overlay
        run: |
          set -euo pipefail
          ZIP="Stonefellow-v1.3.35-Deploy.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          zip -r "$ZIP" . \
            -x '.git/*' \
               '.github/*' \
               'data/*' \
               'storage/*' \
               'config/database.php' \
               'config/app-secret.php' \
               'config/store.php' \
               'assets/js/config.js' \
               'assets/js/catalog.js' \
               'assets/js/releases.js' \
               "$ZIP" "$ZIP.sha256"
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^(data/|storage/|config/database.php$|config/app-secret.php$|config/store.php$|assets/js/(config|catalog|releases)\.js$)')" -eq 0
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^api/video-core.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^api/videos.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/api/videos.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/assets/video.js$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^admin/assets/video.css$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^tests/v1335-section36-video.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^AUDIT-REPORT.md$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^TEST-RESULTS.txt$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^RELEASE-NOTES.md$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^UPGRADE-NOTES.md$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^upgrade.php$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^version.php$')" -eq 1

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stonefellow-v1.3.35-Deploy
          path: |
            Stonefellow-v1.3.35-Deploy.zip
            Stonefellow-v1.3.35-Deploy.zip.sha256
          if-no-files-found: error
          retention-days: 7
