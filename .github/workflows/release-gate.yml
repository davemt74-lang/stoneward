name: Stonefellow Release Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' ! -path './storage/*' -print0 | xargs -0 -n1 php -l

      - name: Public JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/library.js
          node --check assets/js/accessibility.js

      - name: Admin JavaScript syntax
        run: |
          node --check admin/assets/admin.js
          node --check admin/assets/agent-actions.js
          node --check admin/assets/campaigns.js
          node --check admin/assets/media.js
          node --check admin/assets/products.js
          node --check admin/assets/automations.js
          node --check admin/assets/membership.js
          node --check admin/assets/ticketing.js
          node --check admin/assets/fulfillment.js
          node --check admin/assets/operating-calendar.js
          node --check admin/assets/analytics.js
          node --check admin/assets/rights.js
          node --check admin/assets/distribution.js
          node --check admin/assets/press.js
          node --check admin/assets/homepage.js
          node --check admin/assets/stories.js
          node --check admin/assets/theme.js
          node --check admin/assets/songbook.js
          node --check admin/assets/video.js
          node --check admin/assets/gallery.js
          node --check admin/assets/inquiries.js

      - name: v1.3 regression suites
        run: |
          set -euo pipefail
          php tests/v130-section1-personalization.php
          php tests/v131-playlist-behavior.php
          php tests/v131-section2-playlists.php
          php tests/v132-section3-listening-history.php
          php tests/v133-section4-personalized-recommendations.php
          php tests/v134-section5-rich-track-release-pages.php
          php tests/v135-section6-agent-listening-sessions.php
          php tests/v136-section7-queue-up-next.php
          php tests/v137-section8-custom-record-mixtape-v2.php
          php tests/v138-section9-personalized-home.php
          php tests/v139-section10-admin-listening-conversion-analytics.php
          php tests/v1310-section11-smart-notifications.php
          php tests/v1311-section12-search-discovery.php
