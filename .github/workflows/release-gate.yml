name: Stonefellow Release Gate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: read

jobs:
  # Every draft gets lightweight changed-file syntax and workflow policy checks.
  pr-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changed PHP/JS files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_pr_smoke.py
      - name: Verify CI release gating policy
        run: python3 tests/ci_g1_release_policy.py

  release-gate:
    # Full release suite runs once ready for review and on every main merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP with real database drivers
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, zip
          coverage: none

      - name: PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' ! -path './storage/*' -print0 | xargs -0 -n1 php -l

      - name: Public JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/conversation-barge-in.js
          node --check assets/js/build-integrity.js
          node --check service-worker.js
          node --check assets/js/artist-home-renderer.js
          node --check assets/js/agent-brain.js
          node --check assets/js/agent-chat-canvas.js
          node --check assets/js/library.js
          node --check assets/js/owned-music.js
          node tests/section85a-owned-ui.cjs
          node --check assets/js/accessibility.js

      - name: Admin JavaScript syntax
        run: |
          node --check admin/assets/admin.js
          node --check admin/assets/stripe-connect.js
          node --check admin/assets/commerce-ops.js
          node --check admin/assets/agent-canvas.js
          node --check admin/assets/agent-commerce-review.js
          node --check admin/assets/turntable-modules.js
          node --check assets/js/turntable-parts.js
          node --check admin/assets/sidebar-accordion.js
          node --check admin/assets/agent-canvas.js
          node --check admin/assets/agent-actions.js
          node --check admin/assets/campaigns.js
          node --check admin/assets/media.js
          node --check admin/assets/stem-studio.js
          node --check admin/assets/products.js
          node --check admin/assets/automations.js
          node --check admin/assets/membership.js
          node --check admin/assets/ticketing.js
          node --check admin/assets/fulfillment.js
          node --check admin/assets/operating-calendar.js
          node --check admin/assets/analytics.js
          node --check admin/assets/rights.js
          node --check admin/assets/distribution.js
          node --check admin/assets/press.js
          node --check admin/assets/homepage.js
          node --check admin/assets/homepage-builder.js
          node --check admin/assets/homepage-web-editor.js
          node --check admin/assets/homepage-visual.js
          node --check admin/assets/stories.js
          node --check admin/assets/settings-tabs.js
          node --check admin/assets/unified-ui.js
          node --check admin/assets/theme.js
          node --check admin/assets/songbook.js
          node --check admin/assets/video.js
          node --check admin/assets/gallery.js
          node --check admin/assets/inquiries.js

      - name: Set up portable FFmpeg for actual private render certification
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6
        with:
          ffmpeg-version: '6.0.1'
          linking-type: static
      - name: Verify FFmpeg tools
        run: |
          # The supervised PHP renderer intentionally accepts only these local
          # executable paths. Bind the verified CI tool-cache binaries there.
          test -x /usr/local/bin/ffmpeg || sudo ln -s "$(command -v ffmpeg)" /usr/local/bin/ffmpeg
          test -x /usr/local/bin/ffprobe || sudo ln -s "$(command -v ffprobe)" /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: v1.3 regression suites
