name: Stonefellow Release Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP with real database drivers
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none

      - name: PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' ! -path './storage/*' -print0 | xargs -0 -n1 php -l

      - name: Public JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/build-integrity.js
          node --check service-worker.js
          node --check assets/js/artist-home-renderer.js
          node --check assets/js/agent-brain.js
          node --check assets/js/agent-chat-canvas.js
          node --check assets/js/library.js
          node --check assets/js/accessibility.js

      - name: Admin JavaScript syntax
