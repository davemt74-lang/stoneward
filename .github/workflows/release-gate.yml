          php tests/section86d-native-state.php
          php -l api/stem-rpp-plugins.php
          php -l api/stem-plugin-operations.php
          node --check admin/assets/stem-plugin-rack.js
          node tests/section86c-plugin-rack.cjs
          node --check admin/assets/stem-timeline.js
          node --check admin/assets/stem-fx-engine.js
          node tests/section86b-editor.cjs
          node --check admin/assets/stem-waveform.js
          node tests/section86a-waveform.cjs

      - name: Build verified deployment ZIP
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p dist/deploy
          git archive HEAD | tar -x -C dist/deploy
          rm -rf dist/deploy/.github dist/deploy/tests dist/deploy/storage
          # These root documents are historical snapshots from older releases.
          # Replace the misleading v1.3.2 manifest with the actual source commit.
          rm -f dist/deploy/AUDIT-REPORT.md dist/deploy/RELEASE-NOTES.md \
            dist/deploy/TEST-RESULTS.txt dist/deploy/UPGRADE-NOTES.md \
            dist/deploy/DEPLOY-MANIFEST.txt
          {
            echo "Stonefellow — exact-source deployment"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Built at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Scope: Stonefellow PHP/JS application source at the commit above"
            echo "Release checks: GitHub Actions PHP/JS regressions passed before archive creation"
            echo "Private data: config/secrets, storage, customer records and host settings are not included"
            echo "Schema: read current api/migrations.php and upgrade.php on the target host"
            echo "Pilot readiness: Section 83 code included; external Stripe, mailer, browser, POD and backup rehearsals pending"
            echo "Safety: source acceptance never authorizes Stripe live payments"
          } > dist/deploy/DEPLOY-MANIFEST.txt
          test -s dist/deploy/api/production-pilot.php
          test -s dist/deploy/docs/section83-production-pilot.md
          grep -Fx "Source commit: $(git rev-parse HEAD)" dist/deploy/DEPLOY-MANIFEST.txt
          (cd dist/deploy && zip -q -r ../stonefellow-section62c-full-deploy.zip .)
          unzip -p dist/stonefellow-section62c-full-deploy.zip DEPLOY-MANIFEST.txt | grep -Fx "Source commit: $(git rev-parse HEAD)"
          (cd dist && sha256sum stonefellow-section62c-full-deploy.zip > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          unzip -t dist/stonefellow-section62c-full-deploy.zip | tail -1

      - name: Publish certified deployment ZIP
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: stonefellow-section62c-full-deployment
          path: |
            dist/stonefellow-section62c-full-deploy.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  mysql-certification:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: MySQL checkout inventory certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PHP MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Start isolated MySQL with ephemeral CI credentials
        shell: bash
        run: |
          set -euo pipefail
          sf_ci_db_password="$(openssl rand -hex 24)"
          sf_ci_root_password="$(openssl rand -hex 24)"
          echo "::add-mask::$sf_ci_db_password"
          echo "::add-mask::$sf_ci_root_password"
          printf 'SF_E2_DB_USER=stonefellow\nSF_E2_DB_PASS=%s\n' "$sf_ci_db_password" >> "$GITHUB_ENV"
          docker run --detach --name stonefellow-ci-mysql \
            --publish 127.0.0.1:3306:3306 \
            --env MYSQL_DATABASE=stonefellow_test \
            --env MYSQL_USER=stonefellow \
            --env MYSQL_PASSWORD="$sf_ci_db_password" \
            --env MYSQL_ROOT_PASSWORD="$sf_ci_root_password" mysql:8.0
          for attempt in {1..45}; do
            if docker exec stonefellow-ci-mysql mysql -h127.0.0.1 \
              -ustonefellow -p"$sf_ci_db_password" stonefellow_test \
              -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'Disposable MySQL service did not become ready.' >&2
          exit 1
      - name: Real MySQL commerce and simultaneous final-unit checkout
        run: |
          SF_E4_EPHEMERAL=yes php tests/section75e4-mysql-legacy-upgrade.php
          php tests/section75e2-mysql-commerce.php
          php tests/section84b6-mysql-device-pairing.php
          php tests/section88d2g-mysql-production.php
      - name: Remove disposable MySQL service
        if: always()
        run: docker rm --force stonefellow-ci-mysql || true
