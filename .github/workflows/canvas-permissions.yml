name: Canvas Permissions and Consent Certification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canvas-permissions-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SF_TEST_PHP: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, curl, fileinfo, mbstring
          coverage: none
      - name: Disposable database and audio fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg mariadb-server
      - name: Registry, policy, remembered consent and delivery
        run: |
          php tests/section44a-tool-registry.php
          php tests/canvas-capabilities.php
          php tests/canvas-access.php
          php tests/canvas-permission-delivery.php
      - name: Project, gallery and resource compatibility
        run: |
          php tests/canvas-projects.php
          php tests/canvas-gallery.php
          php tests/canvas-gallery-privacy.php
          php tests/canvas-gallery-attribution-history.php
          php tests/canvas-resources.php
          php tests/canvas-resource-scenes.php
      - name: Published story inventory, tags, approval and live data
        run: |
          php tests/canvas-stories-public.php
          php tests/canvas-stories-flow.php
          php tests/canvas-stories-dataset.php
      - name: Published lyric text, cue authorization and approved canvas builds
        run: |
          php tests/canvas-lyrics.php
          php tests/canvas-lyrics-flow.php
          php tests/canvas-lyrics-dataset.php
      - name: Account data inventory, sources and scope-bound approvals
        run: |
          php tests/canvas-account-data.php
          php tests/canvas-me-flow.php
          php tests/canvas-me-delivery.php
      - name: Live data catalog, scoped reads and NWS provider contract
        run: |
          php tests/canvas-weather.php
          php tests/canvas-data-places.php
          php tests/canvas-data-flow.php
          python tests/canvas-data-http.py
      - name: Real PHP endpoint authentication, CSRF and current-viewer data
        run: |
          python tests/canvas-permissions-http.py
          python tests/canvas-access-http.py
          python tests/canvas-stories-public-http.py
      - name: Native MariaDB transactions, rollback and independent-worker races
        env:
          SF_MARIADB_ROOT: /
        run: python tests/canvas-permissions-mysql.py
  canvas-permissions-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SF_TEST_PHP: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, curl, fileinfo, mbstring
          coverage: none
      - name: Browser and audio fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_BIN=' + p.chromium.executable_path + '\n')
          PY
      - name: Mobile and desktop permission and consent controls
        run: |
          python tests/canvas-permissions-browser.py
          python tests/canvas-access-browser.py
      - name: Real PHP and production consent UI roundtrip
        run: python tests/canvas-access-integration-browser.py
      - name: Story selection, tag editing and live canvas rendering
        run: |
          python tests/canvas-stories-picker-browser.py
          python tests/canvas-stories-admin-tags-browser.py
          python tests/canvas-stories-dataset-browser.py
      - name: Lyric picker and isolated playback-synced canvas data
        run: |
          python tests/canvas-lyrics-picker-browser.py
          python tests/canvas-lyrics-dataset-browser.py
      - name: Account data picker and private preview boundary
        run: |
          python tests/canvas-me-picker-browser.py
          python tests/canvas-scene-tester-browser.py
      - name: Live data discovery and authored source combinations
        run: |
          python tests/canvas-data-picker-browser.py
          python tests/canvas-data-runtime-browser.py
      - name: Existing public and administrator gallery controls
        run: |
          python tests/canvas-gallery-browser.py
          python tests/admin-canvas-gallery-browser.py
