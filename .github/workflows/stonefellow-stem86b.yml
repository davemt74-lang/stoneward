name: Stonefellow Stem Editor Timeline 86B
on:
  pull_request:
    paths:
      - 'api/stem-editor-core.php'
      - 'api/stem-studio-core.php'
      - 'admin/assets/stem-studio.js'
      - 'admin/assets/stem-timeline.js'
      - 'admin/assets/stem-fx-engine.js'
      - 'admin/assets/stem-studio.css'
      - 'admin/index.php'
      - 'tests/section86b-timeline-fx.php'
      - 'tests/section86b-editor.cjs'
      - '.github/workflows/stonefellow-stem86b.yml'
  push:
    branches: [main]
    paths:
      - 'api/stem-editor-core.php'
      - 'api/stem-studio-core.php'
      - 'admin/assets/stem-studio.js'
      - 'admin/assets/stem-timeline.js'
      - 'admin/assets/stem-fx-engine.js'
      - 'tests/section86b-timeline-fx.php'
      - 'tests/section86b-editor.cjs'
permissions:
  contents: read
jobs:
  clip-fx-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -e
          php -l api/stem-editor-core.php
          php -l api/stem-studio-core.php
          node --check admin/assets/stem-studio.js
          node --check admin/assets/stem-timeline.js
          node --check admin/assets/stem-fx-engine.js
          php tests/section86b-timeline-fx.php
          node tests/section86b-editor.cjs
          php tests/section86a-stem-studio.php
