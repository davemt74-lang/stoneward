name: Stonefellow Fan Purchase Read Model 87B1
on:
  pull_request:
    paths:
      - 'api/fan-purchase-journey*'
      - 'tests/section87b1-*'
      - '.github/workflows/stonefellow-fan87b1.yml'
  push:
    branches: [main]
    paths:
      - 'api/fan-purchase-journey*'
      - 'tests/section87b1-*'
permissions:
  contents: read
jobs:
  paid-entitlement-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - run: |
          set -eu
          php -l api/fan-purchase-journey-core.php
          php -l api/fan-purchase-journey.php
          php tests/section87b1-purchase-journey.php
          php tests/section87a1-discovery.php
          php tests/section84b3-print-licenses.php
          php tests/section78-customer-commerce.php
          php tests/section85a-fan-library.php
