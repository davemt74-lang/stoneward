name: Canvas Playlists Certification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  canvas-playlists-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SF_TEST_PHP: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, curl, fileinfo, mbstring, dom
          coverage: none
      - name: Disposable database and audio fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg mariadb-server
      - name: SQLite playlist inventory, publication, approval and playback scope
        run: |
          php tests/canvas-playlists.php
          php tests/canvas-playlists-integration.php
      - name: PHP HTTP inventory, admin authorization and fresh runtime resources
        run: |
          python tests/canvas-playlists-http.py
          python tests/canvas-playlists-project-http.py
      - name: Composer selection, host context and audio SDK contracts
        run: |
          node tests/canvas-playlists-composer.cjs
          node tests/canvas-audio-runtime-context.cjs
          node tests/canvas-audio-sdk.test.cjs
      - name: Native MariaDB playlist contracts and concurrent edits
        env:
          SF_MARIADB_ROOT: /
        run: python tests/canvas-playlists-mysql.py
  canvas-playlists-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SF_TEST_PHP: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, fileinfo, mbstring, dom
          coverage: none
      - name: Matching Chromium and audio fixture dependencies
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_BIN=' + playwright.chromium.executable_path + '\n')
          PY
      - name: Public playlist picker and administrator publication controls
        run: |
          python tests/canvas-playlists-picker-browser.py
          python tests/canvas-playlists-admin-browser.py
      - name: Native playback with current playlist authorization
        run: python tests/canvas-playlists-runtime-browser.py
