name: Build Stonefellow v1.3.10 Deploy

on:
  push:
    branches:
      - package/v1310-deploy

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact package branch
        uses: actions/checkout@v4

      - name: Build deploy package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Stonefellow-v1.3.10-Deploy"
          rm -rf "$ROOT" Stonefellow-v1.3.10-Deploy.zip Stonefellow-v1.3.10-Deploy.zip.sha256
          mkdir -p "$ROOT"

          rsync -a ./ "$ROOT"/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='AUDIT-REPORT.md' \
            --exclude='TEST-RESULTS.txt' \
            --exclude='DEPLOY-MANIFEST.txt' \
            --exclude='config/store.php' \
            --exclude='data/' \
            --exclude='storage/' \
            --exclude='assets/js/config.js' \
            --exclude='assets/js/catalog.js' \
            --exclude='assets/js/releases.js' \
            --exclude='Stonefellow-v1.3.10-Deploy/' \
            --exclude='Stonefellow-v1.3.10-Deploy.zip' \
            --exclude='Stonefellow-v1.3.10-Deploy.zip.sha256'

          cat > "$ROOT/DEPLOY-MANIFEST.txt" <<'EOF'
          Stonefellow v1.3.10 Section 11 deploy package
          Source main commit: 036bf816eec8780add50a7228bffd7a8b13ca0d2
          Database schema target: 1.3.10

          Deployment:
          1. Upload the ZIP to the Stonefellow web root.
          2. Extract over the existing installation.
          3. Run /upgrade.php to apply migration 2026-10-08-011.
          4. Confirm /version.php reports Stonefellow 1.3.10 and database schema target 1.3.10.
          5. For inactive-user re-engagement, schedule: php /path/to/stonefellow/cron-notifications.php
             Hourly is a reasonable default; persistent dedupe makes repeated runs safe.

          Section 11 first-run behavior:
          - Notification generation establishes a baseline before creating smart reminders.
          - Existing releases, old listening progress, and old saved builds do not create an upgrade notification storm.
          - Smart email notifications remain opt-in per user/category.

          Intentionally preserved / not overwritten:
          - config/store.php
          - config/database.php (not tracked in repository)
          - config/app-secret.php (not tracked in repository)
          - data/
          - storage/
          - assets/js/config.js
          - assets/js/catalog.js
          - assets/js/releases.js

          Development-only files excluded:
          - .github/
          - tests/
          - AUDIT-REPORT.md
          - TEST-RESULTS.txt
          EOF

          (
            cd "$ROOT"
            find . -type f ! -name 'FILE-SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > FILE-SHA256SUMS.txt
          )

          zip -qr Stonefellow-v1.3.10-Deploy.zip "$ROOT"
          sha256sum Stonefellow-v1.3.10-Deploy.zip > Stonefellow-v1.3.10-Deploy.zip.sha256

          unzip -t Stonefellow-v1.3.10-Deploy.zip
          test -f "$ROOT/upgrade.php"
          test -f "$ROOT/api/notification-core.php"
          test -f "$ROOT/api/notifications.php"
          test -f "$ROOT/cron-notifications.php"
          test -f "$ROOT/api/analytics-core.php"
          test -f "$ROOT/admin/assets/analytics.js"
          test -f "$ROOT/version.php"
          grep -q "2026-10-08-011" "$ROOT/api/migrations.php"
          grep -q "1.3.10" "$ROOT/version.php"
          test ! -e "$ROOT/config/store.php"
          test ! -e "$ROOT/data"
          test ! -e "$ROOT/storage"
          test ! -e "$ROOT/assets/js/config.js"
          test ! -e "$ROOT/tests"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stonefellow-v1.3.10-Deploy
          path: |
            Stonefellow-v1.3.10-Deploy.zip
            Stonefellow-v1.3.10-Deploy.zip.sha256
          if-no-files-found: error
          compression-level: 0
