name: Saved Catalog Lyric Timeline Certification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  saved-lyric-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Disposable MySQL with a fresh masked job credential
        run: bash .github/scripts/start-test-mysql.sh stonefellow_lyrics_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, curl, fileinfo, zip
          coverage: none
      - name: Saved lyric playback, timeline, and upload editor controls
        run: |
          node --test tests/section91b22a-lyric-timeline.cjs
          node --test tests/section91b22a-admin-lyrics.cjs
          node --test tests/section91b22a-saved-listening.cjs
      - name: SQLite lyric revisions, upload import, and saved section authorization
        env:
          SF_TEST_DRIVER: sqlite
        run: |
          php tests/section91b22a-lyric-timeline.php
          php tests/section91b22a-lyrics-import.php
          php tests/section91b22a-saved-section.php
      - name: MySQL lyric revisions, upload import, and saved section authorization
        env:
          SF_TEST_DRIVER: mysql
        run: |
          php tests/section91b22a-lyric-timeline.php
          php tests/section91b22a-lyrics-import.php
          php tests/section91b22a-saved-section.php
      - name: Host configuration and exact-source deployment preservation
        run: |
          php tests/deploy-store-config.php
          python3 tests/deploy-config-preservation.py
  saved-lyric-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Leave time for cold browser provisioning before the native checks run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Production saved lyric timeline on mobile and desktop
        env:
          SF_LYRICS_BROWSER: ${{ matrix.browser }}
          SF_LYRICS_EVIDENCE: saved-lyric-evidence
        run: python tests/section91b22a-timeline-browser.py
      - name: Admin Song Moments preview on mobile and desktop
        env:
          SF_LYRICS_BROWSER: ${{ matrix.browser }}
          SF_LYRICS_EVIDENCE: saved-lyric-evidence
        run: python tests/section91b22e-admin-moment-preview-browser.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-lyric-timeline-${{ matrix.browser }}
          path: saved-lyric-evidence
          if-no-files-found: ignore
